---
- name: Check if k9s is installed
  ansible.builtin.stat:
    path: /usr/local/bin/k9s
  register: k9s_binary

- name: Install k9s
  when: not k9s_binary.stat.exists
  block:
    - name: Get latest k9s release info
      ansible.builtin.uri:
        url: https://api.github.com/repos/derailed/k9s/releases/latest
        return_content: true
      register: k9s_release

    - name: Download and install k9s binary
      become: true
      ansible.builtin.shell: |
        VERSION="{{ k9s_release.json.tag_name }}"
        curl -sL "https://github.com/derailed/k9s/releases/download/${VERSION}/k9s_Linux_amd64.tar.gz" \
          | tar xz -C /tmp k9s
        mv /tmp/k9s /usr/local/bin/k9s
        chmod +x /usr/local/bin/k9s
