---
- name: Configure WSL interop to inherit Windows PATH
  become: true
  ansible.builtin.blockinfile:
    path: /etc/wsl.conf
    create: true
    marker: "# {mark} ANSIBLE MANAGED - interop"
    block: |
      [interop]
      appendWindowsPath = true
    mode: '0644'

- name: Check if code command is available in PATH
  ansible.builtin.shell: command -v code
  register: code_in_path
  failed_when: false
  changed_when: false

- name: Find VS Code installation in Windows paths
  ansible.builtin.shell: |
    for path in \
      "/mnt/c/Users/{{ ansible_env.USER }}/AppData/Local/Programs/Microsoft VS Code/bin" \
      "/mnt/c/Program Files/Microsoft VS Code/bin"; do
      if [ -d "$path" ]; then
        echo "$path"
        exit 0
      fi
    done
    exit 1
  register: vscode_found_path
  failed_when: false
  changed_when: false
  when: code_in_path.rc != 0

- name: Add VS Code to PATH in .bashrc
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    regexp: '^export PATH=.*Microsoft VS Code'
    line: 'export PATH="$PATH:{{ vscode_found_path.stdout | default("") | trim }}"'
  when:
    - code_in_path.rc != 0
    - (vscode_found_path.rc | default(1)) == 0

- name: Warn if VS Code not found on Windows
  ansible.builtin.debug:
    msg: "WARNING: VS Code not found. Install VS Code on Windows, then re-run: ansible-playbook -i inventory.ini site.yml --tags vscode"
  when:
    - code_in_path.rc != 0
    - (vscode_found_path.rc | default(1)) != 0

# Extension installation – idempotent via changed_when on output text
- name: Install VS Code extensions
  ansible.builtin.shell: |
    {% if code_in_path.rc != 0 and (vscode_found_path.rc | default(1)) == 0 %}
    export PATH="$PATH:{{ vscode_found_path.stdout | trim }}"
    {% endif %}
    code --install-extension {{ item.id }} 2>&1
  register: ext_result
  changed_when: "'already installed' not in ext_result.stdout"
  failed_when: ext_result.rc != 0
  loop:
    # ── WSL ──────────────────────────────────────────────────────────────
    - { id: ms-vscode-remote.remote-wsl,              desc: "Remote – WSL" }

    # ── Python ───────────────────────────────────────────────────────────
    - { id: ms-python.python,                         desc: "Python (core)" }
    - { id: ms-python.vscode-pylance,                 desc: "Pylance (language server)" }
    - { id: ms-python.black-formatter,                desc: "Black formatter" }
    - { id: ms-python.isort,                          desc: "isort import sorter" }
    - { id: charliermarsh.ruff,                       desc: "Ruff linter" }
    - { id: ms-python.debugpy,                        desc: "Python Debugger" }
    - { id: ms-toolsai.jupyter,                       desc: "Jupyter notebooks" }

    # ── Go ───────────────────────────────────────────────────────────────
    - { id: golang.go,                                desc: "Go (official)" }

    # ── Kubernetes / Cloud Native ─────────────────────────────────────────
    - { id: ms-kubernetes-tools.vscode-kubernetes-tools, desc: "Kubernetes Tools" }
    - { id: redhat.vscode-yaml,                       desc: "YAML (k8s manifests)" }
    - { id: ms-azuretools.vscode-docker,              desc: "Docker" }
    - { id: tim-koehler.helm-intellisense,            desc: "Helm IntelliSense" }
    - { id: mindaro-dev.mindaro,                      desc: "Bridge to Kubernetes" }

    # ── DevOps / Git ─────────────────────────────────────────────────────
    - { id: hashicorp.terraform,                      desc: "Terraform (IaC for k8s infra)" }
    - { id: github.vscode-github-actions,             desc: "GitHub Actions" }
    - { id: eamodio.gitlens,                          desc: "GitLens" }
  when: code_in_path.rc == 0 or (vscode_found_path.rc | default(1)) == 0
  loop_control:
    label: "{{ item.desc }}"
