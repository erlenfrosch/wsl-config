---
- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  become: true
  ansible.builtin.apt:
    name:
      - curl
      - git
      - build-essential
      - unzip
      - wget
      - ca-certificates
      - software-properties-common
      - gnupg
    state: present

- name: Download GitHub CLI apt signing key
  become: true
  ansible.builtin.shell:
    cmd: curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
    creates: /usr/share/keyrings/githubcli-archive-keyring.gpg

- name: Add GitHub CLI apt repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture }} signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
    filename: github-cli
    state: present

- name: Install GitHub CLI
  become: true
  ansible.builtin.apt:
    name: gh
    state: present
    update_cache: true

- name: Configure passwordless sudo for current user
  become: true
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/{{ ansible_env.USER }}
    line: "{{ ansible_env.USER }} ALL=(ALL) NOPASSWD:ALL"
    create: true
    mode: '0440'
    validate: 'visudo -cf %s'

- name: Configure SSH agent auto-start in .bashrc
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED - ssh-agent"
    block: |
      if [ -z "$SSH_AUTH_SOCK" ]; then
        eval "$(ssh-agent -s)" > /dev/null
        ssh-add ~/.ssh/id_ed25519 2>/dev/null
      fi
