---
- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  become: true
  ansible.builtin.apt:
    name:
      - curl
      - git
      - build-essential
      - unzip
      - wget
      - ca-certificates
      - software-properties-common
      - gnupg
    state: present

- name: Configure passwordless sudo for current user
  become: true
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/{{ ansible_env.USER }}
    line: "{{ ansible_env.USER }} ALL=(ALL) NOPASSWD:ALL"
    create: true
    mode: '0440'
    validate: 'visudo -cf %s'

- name: Configure SSH agent auto-start in .bashrc
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED - ssh-agent"
    block: |
      if [ -z "$SSH_AUTH_SOCK" ]; then
        eval "$(ssh-agent -s)" > /dev/null
        ssh-add ~/.ssh/id_ed25519 2>/dev/null
      fi
