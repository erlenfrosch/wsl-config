"$schema" = 'https://starship.rs/config-schema.json'

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold blue"

[git_branch]
symbol = "git:"
format = "[$symbol$branch]($style) "
style = "bold purple"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
conflicted = "!"
ahead = "^${count}"
behind = "v${count}"
diverged = "<${ahead_count}>${behind_count}"
untracked = "?"
stashed = "$"
modified = "*"
staged = "+"
renamed = ">>"
deleted = "x"
style = "bold red"

[kubernetes]
disabled = false
format = '[k8s:$context(\($namespace\))]($style) '
style = "bold cyan"

[python]
disabled = false
format = '[py:$version]($style) '
style = "bold yellow"

[golang]
disabled = false
format = '[go:$version]($style) '
style = "bold cyan"

[line_break]
disabled = false

[character]
success_symbol = "[>](bold green)"
error_symbol = "[x](bold red)"
